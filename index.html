<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020507">
  <meta name="description" content="Jij doet waar je goed in bent. De rest is Bytezaak.">
  <title>Bytezaak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="525x525" href="assets/images/icon-white%20radius.png">
  <link rel="apple-touch-icon" href="assets/images/icon-white%20radius.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #020507;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      isolation: isolate;
      background: #020507;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -12%;
      z-index: -1;
      pointer-events: none;
      /* The icon's cyan upper-left corner, black centre and pink lower-right corner. */
      background:
        radial-gradient(ellipse at 0% 0%, #087784 0%, #00363e 20%, transparent 53%),
        radial-gradient(ellipse at 100% 100%, #831449 0%, #39051f 23%, transparent 57%),
        #020507;
      animation: gradient-drift 30s ease-in-out infinite alternate;
    }

    @keyframes gradient-drift {
      from { transform: translate(-2%, -2%) scale(1); }
      to { transform: translate(3%, 3%) scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: clamp(2rem, 7vw, 7rem) clamp(1.5rem, 7vw, 7rem);
      text-align: center;
    }

    h1 {
      width: min(100%, 66rem);
      margin: 0;
      font-weight: 500;
    }

    .lead {
      display: block;
      font-size: clamp(1.8rem, 4.2vw, 3.75rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .rest {
      display: block;
      margin-top: clamp(1.1rem, 2.5vw, 2rem);
      color: #d8d7e1;
      font-size: clamp(1.2rem, 2.3vw, 1.75rem);
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: -0.025em;
    }

    .wordmark {
      display: block;
      width: min(100%, 57rem);
      height: auto;
      margin: clamp(1.75rem, 4.5vw, 3.5rem) auto 0;
    }

    @media (max-width: 480px) {
      main { padding-inline: 1.5rem; }
      .lead { max-width: 16ch; margin-inline: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <span class="lead">Jij doet waar je goed in bent.</span>
      <span class="rest">De rest is</span>
      <img class="wordmark" src="assets/images/logo-white.png" width="2600" height="525" alt="Bytezaak." fetchpriority="high" decoding="async">
    </h1>
  </main>
</body>
</html>
