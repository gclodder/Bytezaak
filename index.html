<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bytezaak</title>
  <style>
    body {
      margin: 0;
      background: #f8f7f4;
      color: #171717;
      font-family: system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 4rem);
      line-height: 1.15;
      text-wrap: balance;
    }

    span {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jij doet waar je goed in bent. <span>De rest is Bytezaak.</span></h1>
  </main>
</body>
</html>
